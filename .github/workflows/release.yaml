name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
      - 'develop'
  workflow_dispatch:

env:
  NODE_VERSION: 22

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    name: Release Helm Chart
    steps:
      - uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.BOT_APPLICATION_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.3'

      - name: Helm registry login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Prepare repository
        run: |
          git config user.email "ci@geniro.ai"
          git config user.name "Geniro Bot"

      - name: Semantic Release
        run: pnpm run up-versions
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
