# =============================================================================
# Geniro — Example Values (Complete Reference)
# =============================================================================
# A working configuration with core services enabled and LLM models routed
# through OpenRouter. Replace placeholder keys with your own.
#
# Optional components (Daytona, Zitadel) are included below as commented
# sections. Uncomment and configure as needed.
#
# Usage:
#   helm install geniro ./geniro-dist/helm/geniro -f examples/quickstart-values.yaml

# -----------------------------------------------------------------------------
# Secrets (REQUIRED — replace placeholders before installing)
# -----------------------------------------------------------------------------
secrets:
  # OpenRouter API key — get one at https://openrouter.ai/keys
  openrouterApiKey: "sk-or-v1-REPLACE_WITH_YOUR_OPENROUTER_KEY"

  # LiteLLM admin key — used to manage models via the LiteLLM admin UI
  litellmMasterKey: "REPLACE_ME_LITELLM_MASTER_KEY"
  litellmSaltKey: "REPLACE_ME_SALT_KEY"

  # GitHub App (optional — needed for GitHub integration)
  # githubApp:
  #   id: "123456"
  #   privateKey: |
  #     -----BEGIN RSA PRIVATE KEY-----
  #     ...
  #     -----END RSA PRIVATE KEY-----
  #   clientId: "Iv1.abc123"
  #   clientSecret: "your-client-secret"

# -----------------------------------------------------------------------------
# API
# -----------------------------------------------------------------------------
api:
  ingress:
    enabled: true
    className: nginx
    host: api.geniro.example.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # tls:
    #   - secretName: api-geniro-tls
    #     hosts:
    #       - api.geniro.example.com

# -----------------------------------------------------------------------------
# Web
# -----------------------------------------------------------------------------
web:
  ingress:
    enabled: true
    className: nginx
    host: geniro.example.com
    # tls:
    #   - secretName: geniro-web-tls
    #     hosts:
    #       - geniro.example.com

# -----------------------------------------------------------------------------
# LiteLLM — Model Configuration via OpenRouter
# -----------------------------------------------------------------------------
# All models are routed through OpenRouter (https://openrouter.ai).
# You only need a single OpenRouter API key to access models from
# Anthropic, OpenAI, Google, DeepSeek, and more.
#
# To add more models, see: https://openrouter.ai/models
litellm:
  enabled: true
  config:
    general_settings:
      store_model_in_db: true
      store_prompts_in_spend_logs: true
      forward_client_headers_to_llm_api: true
    litellm_settings:
      proxy_logging: false
      success_logging: true
      drop_params: true
    model_list:
      # ── Anthropic (Claude) ──────────────────────────────────────────────
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: openrouter/anthropic/claude-sonnet-4-6
          api_key: os.environ/OPENROUTER_API_KEY
          max_tokens: 64000
          base_model: claude-sonnet-4-6
      - model_name: claude-haiku-4-5
        litellm_params:
          model: openrouter/anthropic/claude-haiku-4-5
          api_key: os.environ/OPENROUTER_API_KEY
          base_model: claude-haiku-4-5

      # ── OpenAI ──────────────────────────────────────────────────────────
      - model_name: gpt-4o-mini
        litellm_params:
          model: openrouter/openai/gpt-4o-mini
          api_key: os.environ/OPENROUTER_API_KEY

      # ── Embeddings ──────────────────────────────────────────────────────
      - model_name: text-embedding-3-small
        litellm_params:
          model: openrouter/openai/text-embedding-3-small
          api_key: os.environ/OPENROUTER_API_KEY
          base_model: text-embedding-3-small

      # ── Google ──────────────────────────────────────────────────────────
      - model_name: gemini-2.5-flash
        litellm_params:
          model: openrouter/google/gemini-2.5-flash-preview
          api_key: os.environ/OPENROUTER_API_KEY

      # ── DeepSeek ────────────────────────────────────────────────────────
      - model_name: deepseek-chat
        litellm_params:
          model: openrouter/deepseek/deepseek-chat
          api_key: os.environ/OPENROUTER_API_KEY

# To use an external LiteLLM instance instead of the bundled one:
# litellm:
#   enabled: false
# externalLitellm:
#   url: "http://my-litellm.example.com:4000"

# -----------------------------------------------------------------------------
# Keycloak
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: "REPLACE_ME_ADMIN_PASSWORD"
  realm:
    # CORS origins — restrict to your actual web hostname in production.
    webOrigins:
      - "https://geniro.example.com"
    seedUser:
      # WARNING: Stored in ConfigMap (visible in etcd). Change on first login.
      password: "REPLACE_ME_SEED_PASSWORD"
  ingress:
    enabled: true
    className: nginx
    host: auth.geniro.example.com
    # tls:
    #   - secretName: keycloak-tls
    #     hosts:
    #       - auth.geniro.example.com

# -----------------------------------------------------------------------------
# PostgreSQL — use the bundled instance (default)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    postgresPassword: "REPLACE_ME_POSTGRES_PASSWORD"
    password: "REPLACE_ME_POSTGRES_PASSWORD"

# To use an external PostgreSQL instead, set:
# postgresql:
#   enabled: false
# externalPostgresql:
#   host: "your-rds-host.amazonaws.com"
#   port: 5432
#   username: "geniro"
#   password: "your-password"
#   database: "geniro"
#   ssl: true

# -----------------------------------------------------------------------------
# Redis — use the bundled instance (default)
# -----------------------------------------------------------------------------
redis:
  enabled: true

# To use an external Redis (e.g., ElastiCache), set:
# redis:
#   enabled: false
# externalRedis:
#   host: "your-redis.cache.amazonaws.com"
#   port: 6379
#   password: "your-auth-token"   # Optional — ElastiCache auth token, etc.

# -----------------------------------------------------------------------------
# Qdrant — vector database for embeddings
# -----------------------------------------------------------------------------
qdrant:
  enabled: true

# To use external Qdrant (e.g., Qdrant Cloud), set:
# qdrant:
#   enabled: false
# externalQdrant:
#   host: "xyz.us-east-1-0.aws.cloud.qdrant.io"
#   port: 6333
#   apiKey: "your-qdrant-cloud-api-key"   # injected as QDRANT_API_KEY secret

# -----------------------------------------------------------------------------
# Zitadel (alternative identity provider — disabled by default)
# -----------------------------------------------------------------------------
# To use Zitadel instead of Keycloak:
#   1. Uncomment the zitadel block below
#   2. Set keycloak.enabled: false
#   3. Set api.env.authProvider: "zitadel"
#
# IMPORTANT: After first install, Zitadel generates OIDC client IDs dynamically.
# You must retrieve the client ID and upgrade the release:
#   helm upgrade geniro ./helm/geniro \
#     -f examples/quickstart-values.yaml \
#     --set api.env.zitadelClientId=<CLIENT_ID>
#
# Zitadel v3.4.7 is pinned because the Helm chart defaults to v4.x.
# v3.x still includes Login v1 built-in (no separate login container needed).
#
# zitadel:
#   enabled: true
#   image:
#     tag: v3.4.7
#   zitadel:
#     # Exactly 32 characters. Generate with: openssl rand -base64 24 | head -c 32
#     masterkey: "REPLACE_ME_EXACTLY_32_CHARACTERS"
#     configmapConfig:
#       ExternalSecure: true
#       ExternalDomain: "auth.geniro.example.com"
#       ExternalPort: 443
#       TLS:
#         Enabled: false   # TLS is terminated at the ingress/load balancer
#       Database:
#         Postgres:
#           Host: "geniro-postgresql"   # Adjust if using fullnameOverride
#           Port: 5432
#           Database: zitadel
#           User:
#             Username: postgres
#             Password: "REPLACE_ME_POSTGRES_PASSWORD"
#             SSL:
#               Mode: disable
#           Admin:
#             Username: postgres
#             Password: "REPLACE_ME_POSTGRES_PASSWORD"
#             SSL:
#               Mode: disable
#       FirstInstance:
#         Org:
#           Name: "Geniro"
#           Human:
#             Username: "zitadel-admin@geniro.example.com"
#             # REQUIRED: Set a strong password at install time
#             Password: ""
#             PasswordChangeRequired: true
#           Machine:
#             Machine:
#               Username: "geniro-init-sa"
#               Name: "Geniro Init Service Account"
#             Pat:
#               ExpirationDate: "2030-01-01T00:00:00Z"
# keycloak:
#   enabled: false
# api:
#   env:
#     authProvider: "zitadel"
#     zitadelClientId: ""   # Set after Zitadel first boot

# --- External Keycloak (instead of bundled) ---
# To use an external Keycloak instance, disable the bundled one and point
# externalKeycloak.url to your existing provider:
#
# keycloak:
#   enabled: false
#
# externalKeycloak:
#   url: "https://auth.example.com"
#
# api:
#   env:
#     authProvider: "keycloak"
#     keycloakRealm: "my-realm"         # sets KEYCLOAK_REALM env var
#     keycloakClientId: "geniro"        # sets KEYCLOAK_CLIENT_ID env var

# -----------------------------------------------------------------------------
# Daytona (Sandbox Runtime — disabled by default)
# -----------------------------------------------------------------------------
# Provides isolated sandbox environments for agent code execution using Daytona.
# Components: daytona-api, daytona-runner (privileged), daytona-proxy (nginx)
#
# SECURITY WARNING: daytona-runner requires privileged container security
# context for nested container execution (Docker-in-Docker). Run on dedicated
# node pools only. Do NOT run privileged containers on shared or multi-tenant
# nodes.
#
# Generate required secrets before enabling:
#   ADMIN_KEY=$(openssl rand -hex 32)
#   RUNNER_KEY=$(openssl rand -hex 32)
#   ENC_KEY=$(openssl rand -hex 16)
#   ENC_SALT=$(openssl rand -hex 16)
#
# daytona:
#   enabled: true
#   api:
#     image:
#       repository: daytonaio/daytona-api
#       tag: v0.145.0
#     port: 3986
#     resources:
#       requests:
#         cpu: 250m
#         memory: 512Mi
#       limits:
#         cpu: 1000m
#         memory: 1Gi
#     env:
#       adminApiKey: ""       # REQUIRED: generate with: openssl rand -hex 32
#       runnerApiKey: ""      # REQUIRED: shared by runner + proxy
#       encryptionKey: ""     # REQUIRED: generate with: openssl rand -hex 16
#       encryptionSalt: ""    # REQUIRED: generate with: openssl rand -hex 16
#       defaultSnapshot: "daytonaio/sandbox:0.5.0-slim"
#       proxyDomain: "sandboxes.geniro.example.com"
#       proxyProtocol: "https"
#   runner:
#     image:
#       repository: daytonaio/daytona-runner
#       tag: v0.145.0
#     port: 8080
#     resources:
#       requests:
#         cpu: 500m
#         memory: 1Gi
#       limits:
#         cpu: 2000m
#         memory: 4Gi
#     securityContext:
#       privileged: true   # Required for nested container execution
#   proxy:
#     image:
#       repository: nginx
#       tag: "1.27-alpine"
#     port: 80
#     resources:
#       requests:
#         cpu: 50m
#         memory: 32Mi
#       limits:
#         cpu: 100m
#         memory: 64Mi
# api:
#   mountDockerSocket: false   # Disable Docker socket mount when using Daytona
