# =============================================================================
# Geniro — Daytona Sandbox Runtime Example Values
# =============================================================================
# Components: daytona-api, daytona-runner (privileged), daytona-proxy (nginx)
#
# SECURITY WARNING: daytona-runner requires privileged container security
# context for nested container execution (Docker-in-Docker). Run on dedicated
# node pools only. Do NOT run privileged containers on shared or multi-tenant
# nodes.
#
# Usage:
#   helm install geniro ./geniro-dist/helm/geniro -f examples/daytona-values.yaml
#
# Generate required secrets before installing:
#   ADMIN_KEY=$(openssl rand -hex 32)
#   RUNNER_KEY=$(openssl rand -hex 32)
#   ENC_KEY=$(openssl rand -hex 16)
#   ENC_SALT=$(openssl rand -hex 16)

# -----------------------------------------------------------------------------
# Secrets (REQUIRED -- replace placeholders before installing)
# -----------------------------------------------------------------------------
secrets:
  credentialEncryptionKey: "REPLACE_ME_64_CHAR_HEX_KEY_HERE_________________________________"
  openrouterApiKey: "sk-or-v1-REPLACE_WITH_YOUR_OPENROUTER_KEY"
  litellmMasterKey: "sk-litellm-master-key"

# -----------------------------------------------------------------------------
# Daytona (Sandbox Runtime)
# -----------------------------------------------------------------------------
daytona:
  enabled: true
  api:
    image:
      repository: daytonaio/daytona-api
      tag: v0.145.0
    port: 3986
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      adminApiKey: ""       # REQUIRED: generate with: openssl rand -hex 32
      runnerApiKey: ""      # REQUIRED: shared by runner + proxy
      encryptionKey: ""     # REQUIRED: generate with: openssl rand -hex 16
      encryptionSalt: ""    # REQUIRED: generate with: openssl rand -hex 16
      defaultSnapshot: "daytonaio/sandbox:0.5.0-slim"
      proxyDomain: "sandboxes.geniro.example.com"
      proxyProtocol: "https"
  runner:
    image:
      repository: daytonaio/daytona-runner
      tag: v0.145.0
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    securityContext:
      privileged: true   # Required for nested container execution
  proxy:
    image:
      repository: nginx
      tag: alpine
    port: 80
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Disable Docker socket mount when using Daytona
api:
  mountDockerSocket: false

# -----------------------------------------------------------------------------
# Bundled dependencies (all enabled)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
redis:
  enabled: true
qdrant:
  enabled: true
