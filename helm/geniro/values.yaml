# =============================================================================
# Geniro Helm Chart — Default Values
# =============================================================================
# All values in this file serve as defaults. Override with:
#   helm install geniro ./geniro-dist/helm/geniro -f my-values.yaml
#
# Required values (no defaults):
#   secrets.credentialEncryptionKey  — 64-char hex, generate with:
#     node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

# -----------------------------------------------------------------------------
# API (Backend — NestJS)
# -----------------------------------------------------------------------------
api:
  image:
    repository: razumru/geniro-api
    tag: latest
    pullPolicy: IfNotPresent

  replicas: 1
  port: 5000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 5000

  ingress:
    enabled: false
    className: ""
    host: api.geniro.local
    annotations: {}
    # tls:
    #   - secretName: api-geniro-tls
    #     hosts:
    #       - api.geniro.local

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  extraEnv: []
  # Mount the Docker socket for container execution. SECURITY: grants root-equivalent
  # access on the host node. Set to true ONLY when DEFAULT_RUNTIME_TYPE=Docker.
  # When using Daytona (daytona.enabled=true), keep this false.
  mountDockerSocket: false
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Auth and service env vars
  env:
    authProvider: "keycloak"
    # NOTE: The Keycloak URL is resolved automatically from externalKeycloak.url
    # (when keycloak.enabled=false) or the internal service URL (when
    # keycloak.enabled=true). See _helpers.tpl geniro.keycloakUrl.
    keycloakRealm: "geniro"
    keycloakClientId: "geniro"
    # Zitadel — URL and issuer are resolved automatically when zitadel.enabled=true.
    # Set clientId after Zitadel first-boot OIDC app creation (see NOTES.txt).
    zitadelClientId: ""

# -----------------------------------------------------------------------------
# Web (Frontend — React/Vite)
# -----------------------------------------------------------------------------
web:
  image:
    repository: razumru/geniro-web
    tag: latest
    pullPolicy: IfNotPresent

  replicas: 1
  port: 4173

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 4173

  ingress:
    enabled: false
    className: ""
    host: geniro.local
    annotations: {}
    # tls:
    #   - secretName: geniro-web-tls
    #     hosts:
    #       - geniro.local

  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# LiteLLM (LLM Proxy)
# -----------------------------------------------------------------------------
litellm:
  enabled: true

  image:
    repository: ghcr.io/berriai/litellm
    # NOTE: 'main-stable' is a rolling tag. For production, pin to a specific version (e.g., main-v1.71.0).
    tag: main-stable
    pullPolicy: IfNotPresent

  replicas: 1
  port: 4000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 4000

  podSecurityContext: {}
  containerSecurityContext: {}

  config:
    general_settings:
      store_model_in_db: true
      store_prompts_in_spend_logs: true
      forward_client_headers_to_llm_api: true
    litellm_settings:
      proxy_logging: false
      success_logging: true
      drop_params: true
    # model_list seeds LiteLLM's database on first startup (store_model_in_db: true).
    # After first boot, manage models via the LiteLLM admin API
    # (POST /model/new, Authorization: Bearer <litellmMasterKey>).
    # To re-seed from these values, delete the litellm database and redeploy.
    model_list:
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: openrouter/anthropic/claude-sonnet-4-6
          api_key: os.environ/OPENROUTER_API_KEY
          max_tokens: 64000
          base_model: claude-sonnet-4-6
      - model_name: gpt-4o-mini
        litellm_params:
          model: openrouter/openai/gpt-4o-mini
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: text-embedding-3-small
        litellm_params:
          model: openrouter/openai/text-embedding-3-small
          api_key: os.environ/OPENROUTER_API_KEY
          base_model: text-embedding-3-small

# External LiteLLM — use when litellm.enabled=false
externalLitellm:
  url: ""   # e.g., http://my-litellm.example.com:4000

# -----------------------------------------------------------------------------
# Daytona (Sandbox Runtime) — disabled by default
# -----------------------------------------------------------------------------
daytona:
  enabled: false

  api:
    image:
      repository: daytonaio/daytona-api
      tag: v0.145.0
      pullPolicy: IfNotPresent
    port: 3986
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      # REQUIRED when daytona.enabled=true. Set to random, unique values.
      adminApiKey: ""
      # SECURITY NOTE: This key is embedded in the Daytona nginx proxy ConfigMap.
      # ConfigMaps are stored unencrypted in etcd by default. Enable etcd encryption
      # at rest if your security policy requires it. This is an nginx architectural
      # limitation — nginx cannot natively reference Kubernetes Secrets for header values.
      runnerApiKey: ""
      encryptionKey: ""
      encryptionSalt: ""
      defaultSnapshot: "daytonaio/sandbox:0.5.0-slim"
      proxyDomain: "localhost"
      proxyProtocol: "http"

  runner:
    image:
      repository: daytonaio/daytona-runner
      tag: v0.145.0
      pullPolicy: IfNotPresent
    port: 8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    securityContext:
      # Required for nested container execution (Docker-in-Docker).
      # Grants full host kernel access. Run on dedicated node pools only.
      privileged: true

  proxy:
    image:
      repository: nginx
      tag: alpine
      pullPolicy: IfNotPresent
    port: 80
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# -----------------------------------------------------------------------------
# PostgreSQL (Bitnami subchart)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent
  auth:
    postgresPassword: "geniro"
    username: "postgres"
    password: "geniro"
    database: "geniro"
  primary:
    initdb:
      scriptsConfigMap: '{{ printf "%s-postgres-init" .Release.Name }}'
    # pgvector/pgvector image needs writable /var/run/postgresql for the lock file.
    # The Bitnami chart sets readOnlyRootFilesystem=true by default, so we mount
    # an emptyDir to make that path writable.
    extraVolumeMounts:
      - name: postgresql-run
        mountPath: /var/run/postgresql
    extraVolumes:
      - name: postgresql-run
        emptyDir: {}

externalPostgresql:
  host: ""
  port: 5432
  username: "postgres"
  password: ""
  database: "geniro"
  ssl: false

# -----------------------------------------------------------------------------
# Redis (Bitnami subchart)
# -----------------------------------------------------------------------------
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

externalRedis:
  host: ""
  port: 6379
  password: ""   # Optional. If set, added to the Redis URL as redis://:password@host:port

# -----------------------------------------------------------------------------
# Keycloak (official image — quay.io/keycloak/keycloak)
# -----------------------------------------------------------------------------
keycloak:
  enabled: true

  image:
    repository: keycloak/keycloak
    tag: "26.1.4"
    pullPolicy: IfNotPresent

  replicas: 1
  port: 8080

  auth:
    adminUser: admin
    adminPassword: admin

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    host: "auth.geniro.local"
    annotations: {}
    tls: []

  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalKeycloak:
  url: ""
  # NOTE: realm is informational only. The API reads its Keycloak config from
  # api.env.keycloakRealm and api.env.keycloakClientId.
  realm: geniro

# -----------------------------------------------------------------------------
# Zitadel (identity provider — optional, disabled by default)
# -----------------------------------------------------------------------------
# Use instead of Keycloak when AUTH_PROVIDER=zitadel.
# Enable with zitadel.enabled=true and set keycloak.enabled=false.
zitadel:
  enabled: false
  # UPGRADE NOTE: Zitadel generates a dynamic client ID after first boot.
  # You must retrieve it and pass api.env.zitadelClientId explicitly on upgrades.
  # Do not rely on --reuse-values alone since it skips new defaults.
  image:
    tag: v3.4.7   # Pin to v3.x; the chart defaults to v4.x
  # The subchart nests its runtime config under a "zitadel" key in its own values.
  # From the parent chart, these become zitadel.zitadel.masterkey, etc.
  zitadel:
    masterkey: ""    # Exactly 32 characters. Override at install time.
    configmapConfig:
      ExternalSecure: false
      ExternalDomain: "zitadel.geniro.local"
      ExternalPort: 80
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: ""       # Set at install time (e.g., <release-name>-postgresql)
          Port: 5432
          Database: zitadel
          User:
            Username: postgres
            Password: ""
            SSL:
              Mode: disable
          Admin:
            Username: postgres
            Password: ""
            SSL:
              Mode: disable
      FirstInstance:
        Org:
          Name: "Geniro"
          Human:
            Username: "zitadel-admin@geniro.localhost"
            # REQUIRED: Set a strong password at install time
            Password: ""
            PasswordChangeRequired: true
          Machine:
            Machine:
              Username: "geniro-init-sa"
              Name: "Geniro Init Service Account"
            Pat:
              ExpirationDate: "2030-01-01T00:00:00Z"

# External Zitadel — use when zitadel.enabled=false and AUTH_PROVIDER=zitadel
externalZitadel:
  url: ""        # e.g., https://zitadel.example.com
  issuer: ""     # e.g., https://zitadel.example.com (usually same as url)
  # NOTE: OIDC Client ID is set via api.env.zitadelClientId, not here.

# -----------------------------------------------------------------------------
# Qdrant (official Helm chart)
# -----------------------------------------------------------------------------
qdrant:
  enabled: true
  replicaCount: 1

externalQdrant:
  host: ""
  port: 6333
  apiKey: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  # If set, the chart uses this pre-existing Kubernetes Secret instead of creating one.
  # Required keys:
  #   CREDENTIAL_ENCRYPTION_KEY, OPENROUTER_API_KEY, LITELLM_MASTER_KEY,
  #   LITELLM_SALT_KEY, POSTGRES_PASSWORD
  # Conditional keys (include when the corresponding feature is enabled):
  #   LITELLM_DATABASE_URL (when litellm.enabled=true)
  #   KEYCLOAK_ADMIN_PASSWORD (when keycloak.enabled=true)
  #   DAYTONA_ADMIN_API_KEY, DAYTONA_RUNNER_API_KEY,
  #   DAYTONA_ENCRYPTION_KEY, DAYTONA_ENCRYPTION_SALT (when daytona.enabled=true)
  #   QDRANT_API_KEY (when qdrant.enabled=false and externalQdrant.apiKey is set)
  #   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,
  #   GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET (when secrets.githubApp.id is set)
  existingSecret: ""
  credentialEncryptionKey: ""
  openrouterApiKey: ""
  litellmMasterKey: "master"
  litellmSaltKey: "salt"   # Used internally by LiteLLM for budget token signing. Change in production.
  githubApp:
    id: ""
    privateKey: ""
    clientId: ""
    clientSecret: ""

# -----------------------------------------------------------------------------
# Global
# -----------------------------------------------------------------------------
global:
  security:
    # Forwarded to Bitnami subcharts (PostgreSQL, Redis) via Helm's global values propagation.
    # Allows non-Bitnami images (e.g., pgvector/pgvector for PostgreSQL with vector support).
    allowInsecureImages: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
