{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geniro.fullname" . }}-litellm
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  type: {{ .Values.litellm.service.type }}
  ports:
    - port: {{ .Values.litellm.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "geniro.componentSelectorLabels" (dict "component" "litellm" "context" .) | nindent 4 }}
{{- end }}
