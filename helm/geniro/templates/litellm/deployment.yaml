{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geniro.fullname" . }}-litellm
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      {{- include "geniro.componentSelectorLabels" (dict "component" "litellm" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geniro.componentSelectorLabels" (dict "component" "litellm" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.litellm.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          {{- with .Values.litellm.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["litellm"]
          args: ["--config=/app/config.yaml", "--port", {{ .Values.litellm.port | quote }}]
          ports:
            - containerPort: {{ .Values.litellm.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.litellm.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: LITELLM_DATABASE_URL
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              value: "salt"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: OPENROUTER_API_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "geniro.fullname" . }}-litellm-config
{{- end }}
