{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geniro.fullname" . }}-secrets
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
type: Opaque
stringData:
  CREDENTIAL_ENCRYPTION_KEY: {{ required "secrets.credentialEncryptionKey is required. Generate with: node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"" .Values.secrets.credentialEncryptionKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  LITELLM_MASTER_KEY: {{ .Values.secrets.litellmMasterKey | quote }}
  LITELLM_SALT_KEY: {{ .Values.secrets.litellmSaltKey | quote }}
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.auth.adminPassword | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.postgresPassword | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.externalPostgresql.password | quote }}
  {{- end }}
  {{- if .Values.secrets.githubApp.id }}
  GITHUB_APP_ID: {{ .Values.secrets.githubApp.id | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubApp.privateKey | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.secrets.githubApp.clientId | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.secrets.githubApp.clientSecret | quote }}
  {{- end }}
  {{- if and (not .Values.qdrant.enabled) .Values.externalQdrant.apiKey }}
  QDRANT_API_KEY: {{ .Values.externalQdrant.apiKey | quote }}
  {{- end }}
  # Daytona secrets (only when daytona is enabled)
  {{- if .Values.daytona.enabled }}
  DAYTONA_ADMIN_API_KEY: {{ .Values.daytona.api.env.adminApiKey | quote }}
  DAYTONA_RUNNER_API_KEY: {{ .Values.daytona.api.env.runnerApiKey | quote }}
  DAYTONA_ENCRYPTION_KEY: {{ .Values.daytona.api.env.encryptionKey | quote }}
  DAYTONA_ENCRYPTION_SALT: {{ .Values.daytona.api.env.encryptionSalt | quote }}
  {{- end }}
  # LiteLLM database URL
  {{- if .Values.litellm.enabled }}
  {{- $pgUser := ternary "postgres" .Values.externalPostgresql.username .Values.postgresql.enabled }}
  {{- $pgPassword := ternary .Values.postgresql.auth.postgresPassword .Values.externalPostgresql.password .Values.postgresql.enabled }}
  {{- $pgPort := ternary "5432" (.Values.externalPostgresql.port | toString) .Values.postgresql.enabled }}
  LITELLM_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/litellm" $pgUser $pgPassword (include "geniro.postgresHost" .) $pgPort | quote }}
  {{- end }}
{{- end }}
