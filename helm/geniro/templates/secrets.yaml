{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geniro.fullname" . }}-secrets
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  LITELLM_MASTER_KEY: {{ required "secrets.litellmMasterKey is required. Generate with: openssl rand -hex 32" .Values.secrets.litellmMasterKey | quote }}
  LITELLM_SALT_KEY: {{ required "secrets.litellmSaltKey is required. Generate with: openssl rand -hex 32" .Values.secrets.litellmSaltKey | quote }}
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.auth.adminPassword | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.postgresPassword | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.externalPostgresql.password | quote }}
  {{- end }}
  {{- if .Values.secrets.githubApp.id }}
  GITHUB_APP_ID: {{ .Values.secrets.githubApp.id | quote }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubApp.privateKey | quote }}
  GITHUB_APP_CLIENT_ID: {{ .Values.secrets.githubApp.clientId | quote }}
  GITHUB_APP_CLIENT_SECRET: {{ .Values.secrets.githubApp.clientSecret | quote }}
  {{- end }}
  {{- if or (and (not .Values.qdrant.enabled) .Values.externalQdrant.apiKey) (and .Values.qdrant.enabled .Values.qdrant.apiKey) }}
  QDRANT_API_KEY: {{ ternary .Values.qdrant.apiKey .Values.externalQdrant.apiKey .Values.qdrant.enabled | quote }}
  {{- end }}
  # Daytona secrets (only when daytona is enabled)
  {{- if .Values.daytona.enabled }}
  DAYTONA_ADMIN_API_KEY: {{ .Values.daytona.api.env.DAYTONA_ADMIN_API_KEY | quote }}
  DAYTONA_RUNNER_API_KEY: {{ .Values.daytona.api.env.DAYTONA_RUNNER_API_KEY | quote }}
  DAYTONA_ENCRYPTION_KEY: {{ .Values.daytona.api.env.DAYTONA_ENCRYPTION_KEY | quote }}
  DAYTONA_ENCRYPTION_SALT: {{ .Values.daytona.api.env.DAYTONA_ENCRYPTION_SALT | quote }}
  {{- else if .Values.externalDaytona.apiUrl }}
  DAYTONA_API_KEY: {{ .Values.externalDaytona.apiKey | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.password }}
  REDIS_URL: {{ printf "redis://:%s@%s:%v" .Values.externalRedis.password .Values.externalRedis.host (.Values.externalRedis.port | default 6379) | quote }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  # LiteLLM database URL
  {{- if .Values.litellm.enabled }}
  {{- $pgUser := ternary "postgres" .Values.externalPostgresql.username .Values.postgresql.enabled }}
  {{- $pgPassword := ternary .Values.postgresql.auth.postgresPassword .Values.externalPostgresql.password .Values.postgresql.enabled }}
  {{- $pgPort := ternary "5432" (.Values.externalPostgresql.port | toString) .Values.postgresql.enabled }}
  LITELLM_DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/litellm" $pgUser $pgPassword (include "geniro.postgresHost" .) $pgPort | quote }}
  {{- end }}
  # OpenBao token — dev root token for bundled instance, scoped policy token for external
  {{- if .Values.openbao.enabled }}
  OPENBAO_TOKEN: "dev-openbao-token"
  {{- else if .Values.externalOpenbao.token }}
  OPENBAO_TOKEN: {{ .Values.externalOpenbao.token | quote }}
  {{- end }}
{{- end }}
