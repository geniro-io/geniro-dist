{{- if .Values.openbao.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geniro.fullname" . }}-openbao
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  replicas: {{ .Values.openbao.replicas }}
  selector:
    matchLabels:
      {{- include "geniro.componentSelectorLabels" (dict "component" "openbao" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geniro.componentSelectorLabels" (dict "component" "openbao" "context" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/openbao/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openbao.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openbao
          image: "{{ .Values.openbao.image.repository }}:{{ .Values.openbao.image.tag }}"
          imagePullPolicy: {{ .Values.openbao.image.pullPolicy }}
          {{- with .Values.openbao.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh"]
          args: ["/openbao/scripts/entrypoint.sh"]
          ports:
            - containerPort: {{ .Values.openbao.port }}
              name: http
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          volumeMounts:
            - name: data
              mountPath: /openbao/file
              subPath: file
            - name: data
              mountPath: /openbao/init
              subPath: init
            - name: config
              mountPath: /openbao/config/openbao-config.hcl
              subPath: openbao-config.hcl
            - name: config
              mountPath: /openbao/scripts/entrypoint.sh
              subPath: entrypoint.sh
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=200
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.openbao.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "geniro.fullname" . }}-openbao-data
        - name: config
          configMap:
            name: {{ include "geniro.fullname" . }}-openbao-config
            defaultMode: 0500
      {{- with .Values.openbao.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openbao.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.openbao.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
