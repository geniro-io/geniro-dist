{{- if .Values.openbao.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geniro.fullname" . }}-openbao
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  type: {{ .Values.openbao.service.type }}
  ports:
    - port: {{ .Values.openbao.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "geniro.componentSelectorLabels" (dict "component" "openbao" "context" .) | nindent 4 }}
{{- end }}
