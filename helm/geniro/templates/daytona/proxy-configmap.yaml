{{- if .Values.daytona.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geniro.fullname" . }}-daytona-proxy-config
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream runner_backend {
        server {{ include "geniro.fullname" . }}-daytona-runner:{{ .Values.daytona.runner.port }};
    }

    server {
        listen {{ .Values.daytona.proxy.port }};

        location ~ ^/toolbox/([^/]+)/(.*)$ {
            proxy_pass http://runner_backend/sandboxes/$1/toolbox/$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization "Bearer {{ .Values.daytona.api.env.DAYTONA_RUNNER_API_KEY }}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 200m;
        }
    }
{{- end }}
