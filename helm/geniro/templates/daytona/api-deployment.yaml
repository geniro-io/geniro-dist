{{- if .Values.daytona.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geniro.fullname" . }}-daytona-api
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: daytona-api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "geniro.componentSelectorLabels" (dict "component" "daytona-api" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geniro.componentSelectorLabels" (dict "component" "daytona-api" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daytona.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daytona-api
          image: "{{ .Values.daytona.api.image.repository }}:{{ .Values.daytona.api.image.tag }}"
          imagePullPolicy: {{ .Values.daytona.api.image.pullPolicy }}
          {{- with .Values.daytona.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.daytona.api.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.daytona.api.port | quote }}
            - name: DB_HOST
              value: {{ include "geniro.postgresHost" . | quote }}
            - name: DB_PORT
              value: {{ if .Values.postgresql.enabled }}"5432"{{ else }}{{ .Values.externalPostgresql.port | default 5432 | quote }}{{ end }}
            - name: DB_USERNAME
              value: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.username | default "postgres" | quote }}{{ else }}{{ .Values.externalPostgresql.username | default "postgres" | quote }}{{ end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE
              value: "daytona"
            - name: REDIS_HOST
              value: {{ include "geniro.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ if .Values.redis.enabled }}"6379"{{ else }}{{ .Values.externalRedis.port | default 6379 | quote }}{{ end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: REDIS_PASSWORD
            {{- end }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_ENCRYPTION_KEY
            - name: ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_ENCRYPTION_SALT
            - name: OIDC_ISSUER_BASE_URL
              value: ""
            - name: OIDC_CLIENT_ID
              value: ""
            - name: OIDC_AUDIENCE
              value: ""
            - name: RUN_MIGRATIONS
              value: "true"
            - name: NODE_ENV
              value: "production"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_ADMIN_API_KEY
            - name: DEFAULT_RUNNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_RUNNER_API_KEY
            - name: DEFAULT_RUNNER_NAME
              value: "local-runner"
            - name: DEFAULT_RUNNER_API_VERSION
              value: "2"
            - name: DEFAULT_SNAPSHOT
              value: {{ .Values.daytona.api.env.defaultSnapshot | quote }}
            - name: PROXY_DOMAIN
              value: {{ .Values.daytona.api.env.proxyDomain | quote }}
            - name: PROXY_PROTOCOL
              value: {{ .Values.daytona.api.env.proxyProtocol | quote }}
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_RUNNER_API_KEY
            - name: PROXY_TOOLBOX_BASE_URL
              value: {{ printf "http://%s-daytona-proxy:%v" (include "geniro.fullname" .) .Values.daytona.proxy.port | quote }}
            - name: SSH_GATEWAY_URL
              value: ""
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.daytona.api.resources | nindent 12 }}
      {{- with .Values.daytona.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daytona.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daytona.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
