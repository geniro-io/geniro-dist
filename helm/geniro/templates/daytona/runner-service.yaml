{{- if .Values.daytona.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geniro.fullname" . }}-daytona-runner
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: daytona-runner
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.daytona.runner.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "geniro.componentSelectorLabels" (dict "component" "daytona-runner" "context" .) | nindent 4 }}
{{- end }}
