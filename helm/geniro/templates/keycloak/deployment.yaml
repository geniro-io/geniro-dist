{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geniro.fullname" . }}-keycloak
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      {{- include "geniro.componentSelectorLabels" (dict "component" "keycloak" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geniro.componentSelectorLabels" (dict "component" "keycloak" "context" .) | nindent 8 }}
      annotations:
        checksum/realm: {{ include (print $.Template.BasePath "/keycloak/realm-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'timeout 120 sh -c "until nc -z {{ include "geniro.postgresHost" . }} {{ if .Values.postgresql.enabled }}5432{{ else }}{{ .Values.externalPostgresql.port | default 5432 }}{{ end }}; do echo waiting for postgres...; sleep 2; done"']
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          {{- with .Values.keycloak.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - start
            - --import-realm
          ports:
            - containerPort: {{ .Values.keycloak.port }}
              name: http
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.auth.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%s/keycloak" (include "geniro.postgresHost" .) (ternary "5432" (.Values.externalPostgresql.port | toString) .Values.postgresql.enabled) | quote }}
            - name: KC_DB_USERNAME
              value: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.username | default "postgres" | quote }}{{ else }}{{ .Values.externalPostgresql.username | default "postgres" | quote }}{{ end }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # KC_FEATURES audit (March 2026): All previously listed features
            # (account-api, account3, admin-api, admin-fine-grained-authz, admin2,
            # authorization, client-policies, client-secret-rotation, dynamic-scopes,
            # step-up-authentication, token-exchange, transient-users, update-email,
            # web-authn) are GA in Keycloak 26.x and no longer require explicit
            # enabling. Removed the KC_FEATURES env var entirely.
            # Re-audit when upgrading to Keycloak 27.x+.
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm-config
          configMap:
            name: {{ include "geniro.fullname" . }}-keycloak-realm
      {{- with .Values.keycloak.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
