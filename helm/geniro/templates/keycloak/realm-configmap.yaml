{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geniro.fullname" . }}-keycloak-realm
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
data:
  geniro-realm.json: |
    {
      "id": "geniro",
      "realm": "geniro",
      "enabled": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "registrationAllowed": false,
      "rememberMe": false,
      "verifyEmail": false,
      "resetPasswordAllowed": true,
      "accessTokenLifespan": {{ .Values.keycloak.realm.accessTokenLifespanSeconds | default 300 }},
      "ssoSessionIdleTimeout": {{ .Values.keycloak.realm.ssoSessionIdleTimeoutSeconds | default 1800 }},
      "ssoSessionMaxLifespan": {{ .Values.keycloak.realm.ssoSessionMaxLifespanSeconds | default 86400 }},
      "offlineSessionIdleTimeout": 2592000,
      "clients": [
        {
          "clientId": "geniro",
          "name": "Geniro",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "redirectUris": [
            {{- if .Values.web.ingress.enabled }}
            "https://{{ .Values.web.ingress.host }}/*",
            {{- end }}
            "http://localhost:4173/*",
            "http://localhost:5174/*"
          ],
          "webOrigins": {{ .Values.keycloak.realm.webOrigins | toJson }},
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "frontchannelLogout": true,
          "rootUrl": "",
          "adminUrl": "",
          "baseUrl": "",
          "attributes": {
            "post.logout.redirect.uris": "+",
            "oauth2.device.authorization.grant.enabled": "false"
          }
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@geniro.local",
          "credentials": [
            {
              "type": "password",
              "value": {{ .Values.keycloak.realm.seedUser.password | quote }},
              "temporary": true
            }
          ],
          "realmRoles": ["default-roles-geniro"]
        }
      ]
    }
{{- end }}
