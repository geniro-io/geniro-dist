apiVersion: v1
kind: Service
metadata:
  name: {{ include "geniro.fullname" . }}-web
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "geniro.componentSelectorLabels" (dict "component" "web" "context" .) | nindent 4 }}
