apiVersion: v1
kind: Service
metadata:
  name: {{ include "geniro.fullname" . }}-api
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "geniro.componentSelectorLabels" (dict "component" "api" "context" .) | nindent 4 }}
