{{- if .Values.api.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geniro.fullname" . }}-migrate
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.api.migration.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.api.migration.activeDeadlineSeconds | default 300 }}
  template:
    metadata:
      labels:
        {{- include "geniro.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'timeout 120 sh -c "until nc -z {{ include "geniro.postgresHost" . }} {{ if .Values.postgresql.enabled }}5432{{ else }}{{ .Values.externalPostgresql.port | default 5432 }}{{ end }}; do echo waiting for postgres...; sleep 2; done"']
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ['sh', '-c', 'cd /usr/src/app/apps/api && pnpm run migration:run']
          env:
            - name: POSTGRES_HOST
              value: {{ include "geniro.postgresHost" . | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USERNAME
              value: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgresql.auth.database | default "geniro" | quote }}
            {{- else }}
            - name: POSTGRES_PORT
              value: {{ .Values.externalPostgresql.port | default 5432 | quote }}
            - name: POSTGRES_USERNAME
              value: {{ .Values.externalPostgresql.username | default "postgres" | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.externalPostgresql.database | default "geniro" | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SSL
              value: {{ if and (not .Values.postgresql.enabled) .Values.externalPostgresql.ssl }}"true"{{ else }}"false"{{ end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
