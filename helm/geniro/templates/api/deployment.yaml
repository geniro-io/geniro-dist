apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geniro.fullname" . }}-api
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "geniro.componentSelectorLabels" (dict "component" "api" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geniro.componentSelectorLabels" (dict "component" "api" "context" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'timeout 120 sh -c "until nc -z {{ include "geniro.postgresHost" . }} {{ if .Values.postgresql.enabled }}5432{{ else }}{{ .Values.externalPostgresql.port | default 5432 }}{{ end }}; do echo waiting for postgres...; sleep 2; done"']
        - name: wait-for-redis
          image: busybox:1.36@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'timeout 120 sh -c "until nc -z {{ include "geniro.redisHost" . }} {{ if .Values.redis.enabled }}6379{{ else }}{{ .Values.externalRedis.port | default 6379 }}{{ end }}; do echo waiting for redis...; sleep 2; done"']
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "geniro.fullname" . }}-api-config
          env:
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: CREDENTIAL_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: LITELLM_MASTER_KEY
            {{- if not .Values.secrets.existingSecret }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: OPENROUTER_API_KEY
            {{- end }}
            {{- if or .Values.secrets.githubApp.id .Values.secrets.githubApp.enabled }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: GITHUB_APP_CLIENT_ID
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: GITHUB_APP_CLIENT_SECRET
            {{- end }}
            {{- if .Values.daytona.enabled }}
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_ADMIN_API_KEY
            {{- else if .Values.externalDaytona.apiUrl }}
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: DAYTONA_API_KEY
            {{- end }}
            {{- if and (not .Values.redis.enabled) (or .Values.externalRedis.password .Values.secrets.existingSecret) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: REDIS_URL
            {{- end }}
            {{- if and (not .Values.qdrant.enabled) (or .Values.externalQdrant.apiKey .Values.secrets.existingSecret) }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geniro.secretName" . }}
                  key: QDRANT_API_KEY
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/check
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          {{- if .Values.api.mountDockerSocket }}
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
          {{- end }}
      {{- if .Values.api.mountDockerSocket }}
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
