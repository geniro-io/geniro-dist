{{- include "geniro.validateExternalServices" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geniro.fullname" . }}-api-config
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  HTTP_PORT: {{ .Values.api.port | quote }}
  GLOBAL_PATH_PREFIX: "api"

  # Database
  POSTGRES_HOST: {{ include "geniro.postgresHost" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
  POSTGRES_DATABASE: {{ .Values.postgresql.auth.database | default "geniro" | quote }}
  {{- else }}
  POSTGRES_PORT: {{ .Values.externalPostgresql.port | default 5432 | quote }}
  POSTGRES_USERNAME: {{ .Values.externalPostgresql.username | default "postgres" | quote }}
  POSTGRES_DATABASE: {{ .Values.externalPostgresql.database | default "geniro" | quote }}
  {{- end }}
  POSTGRES_RUN_MIGRATIONS: "true"
  POSTGRES_SSL: {{ if and (not .Values.postgresql.enabled) .Values.externalPostgresql.ssl }}"true"{{ else }}"false"{{ end }}

  # Redis
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "geniro.redisHost" .) | quote }}
  {{- else }}
  # When externalRedis.password is set, the full URL (with password) is injected
  # from the Secret via env var override in the deployment (takes precedence).
  REDIS_URL: {{ printf "redis://%s:%v" .Values.externalRedis.host (.Values.externalRedis.port | default 6379) | quote }}
  {{- end }}

  # Qdrant
  QDRANT_URL: {{ include "geniro.qdrantUrl" . | quote }}

  # Auth — Keycloak (primary)
  AUTH_PROVIDER: {{ .Values.api.env.authProvider | default "keycloak" | quote }}
  AUTH_DEV_MODE: {{ .Values.api.env.authDevMode | toString | quote }}
  KEYCLOAK_URL: {{ include "geniro.keycloakUrl" . | quote }}
  KEYCLOAK_REALM: {{ .Values.api.env.keycloakRealm | default "geniro" | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.api.env.keycloakClientId | default "geniro" | quote }}

  # Auth — Zitadel (set api.env.authProvider=zitadel to activate)
  ZITADEL_URL: {{ include "geniro.zitadelUrl" . | quote }}
  ZITADEL_ISSUER: {{ include "geniro.zitadelIssuer" . | quote }}
  ZITADEL_CLIENT_ID: {{ .Values.api.env.zitadelClientId | default "" | quote }}

  # LiteLLM
  {{- $litellmUrl := include "geniro.litellmUrl" . }}
  {{- if $litellmUrl }}
  LLM_BASE_URL: {{ $litellmUrl | quote }}
  {{- end }}

  # Runtime
  DEFAULT_RUNTIME_TYPE: {{ if or .Values.daytona.enabled .Values.externalDaytona.apiUrl }}"Daytona"{{ else }}"Docker"{{ end }}
  DOCKER_RUNTIME_IMAGE: {{ .Values.api.env.dockerRuntimeImage | default "razumru/geniro-runtime:latest" | quote }}
  {{- if .Values.api.mountDockerSocket }}
  DOCKER_SOCKET: "/var/run/docker.sock"
  {{- end }}

  # Knowledge base
  KNOWLEDGE_REINDEX_ON_STARTUP: "true"

  # Daytona
  {{- if .Values.daytona.enabled }}
  DAYTONA_API_URL: {{ printf "http://%s-daytona-api:%v/api" (include "geniro.fullname" .) .Values.daytona.api.port | quote }}
  {{- else if .Values.externalDaytona.apiUrl }}
  DAYTONA_API_URL: {{ .Values.externalDaytona.apiUrl | quote }}
  {{- end }}
