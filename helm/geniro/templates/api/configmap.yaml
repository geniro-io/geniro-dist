{{- include "geniro.validateExternalServices" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geniro.fullname" . }}-api-config
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  HTTP_PORT: {{ .Values.api.port | quote }}
  GLOBAL_PATH_PREFIX: "api"

  # Database
  POSTGRES_HOST: {{ include "geniro.postgresHost" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
  POSTGRES_DATABASE: {{ .Values.postgresql.auth.database | default "geniro" | quote }}
  {{- else }}
  POSTGRES_PORT: {{ .Values.externalPostgresql.port | default 5432 | quote }}
  POSTGRES_USERNAME: {{ .Values.externalPostgresql.username | default "postgres" | quote }}
  POSTGRES_DATABASE: {{ .Values.externalPostgresql.database | default "geniro" | quote }}
  {{- end }}
  POSTGRES_RUN_MIGRATIONS: {{ if .Values.api.migration.enabled }}"false"{{ else }}"true"{{ end }}
  POSTGRES_SSL: {{ if and (not .Values.postgresql.enabled) .Values.externalPostgresql.ssl }}"true"{{ else }}"false"{{ end }}

  # Redis
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "geniro.redisHost" .) | quote }}
  {{- else }}
  # When externalRedis.password is set, the full URL (with password) is injected
  # from the Secret via env var override in the deployment (takes precedence).
  REDIS_URL: {{ printf "redis://%s:%v" .Values.externalRedis.host (.Values.externalRedis.port | default 6379) | quote }}
  {{- end }}

  # Qdrant
  QDRANT_URL: {{ include "geniro.qdrantUrl" . | quote }}

  # Auth — Keycloak (primary)
  AUTH_PROVIDER: {{ .Values.api.env.AUTH_PROVIDER | default "keycloak" | quote }}
  AUTH_DEV_MODE: {{ .Values.api.env.AUTH_DEV_MODE | toString | quote }}
  KEYCLOAK_URL: {{ include "geniro.keycloakUrl" . | quote }}
  KEYCLOAK_REALM: {{ .Values.api.env.KEYCLOAK_REALM | default "geniro" | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.api.env.KEYCLOAK_CLIENT_ID | default "geniro" | quote }}

  # Auth — Zitadel (set api.env.AUTH_PROVIDER=zitadel to activate)
  ZITADEL_URL: {{ include "geniro.zitadelUrl" . | quote }}
  ZITADEL_ISSUER: {{ include "geniro.zitadelIssuer" . | quote }}
  ZITADEL_CLIENT_ID: {{ .Values.api.env.ZITADEL_CLIENT_ID | default "" | quote }}

  # LiteLLM
  {{- $litellmUrl := include "geniro.litellmUrl" . }}
  {{- if $litellmUrl }}
  LLM_BASE_URL: {{ $litellmUrl | quote }}
  {{- end }}

  # OpenBao (Secrets Vault)
  OPENBAO_ADDR: {{ include "geniro.openbaoAddr" . | quote }}

  # Runtime
  DEFAULT_RUNTIME_TYPE: {{ if eq .Values.runtime.provider "k8s" }}"K8s"{{ else if eq .Values.runtime.provider "daytona" }}"Daytona"{{ else }}"Docker"{{ end }}
  DOCKER_RUNTIME_IMAGE: {{ .Values.api.env.DOCKER_RUNTIME_IMAGE | default "razumru/geniro-runtime:latest" | quote }}
  {{- if include "geniro.mountDockerSocket" . }}
  DOCKER_SOCKET: "/var/run/docker.sock"
  {{- end }}

  # K8s sandbox runtime
  {{- if include "geniro.isK8sRuntime" . }}
  K8S_IN_CLUSTER: "true"
  K8S_RUNTIME_NAMESPACE: {{ .Values.k8sRuntime.namespace | quote }}
  K8S_RUNTIME_IMAGE: {{ .Values.k8sRuntime.image | quote }}
  K8S_RUNTIME_CLASS: {{ .Values.k8sRuntime.runtimeClass | quote }}
  K8S_RUNTIME_SERVICE_ACCOUNT: {{ include "geniro.k8sRuntimeSaName" . | quote }}
  K8S_RUNTIME_CPU_REQUEST: {{ .Values.k8sRuntime.resources.requests.cpu | quote }}
  K8S_RUNTIME_CPU_LIMIT: {{ .Values.k8sRuntime.resources.limits.cpu | quote }}
  K8S_RUNTIME_MEMORY_REQUEST: {{ .Values.k8sRuntime.resources.requests.memory | quote }}
  K8S_RUNTIME_MEMORY_LIMIT: {{ .Values.k8sRuntime.resources.limits.memory | quote }}
  K8S_RUNTIME_READY_TIMEOUT_MS: {{ .Values.k8sRuntime.readyTimeoutMs | int64 | quote }}
  K8S_WARM_POOL_SIZE: {{ .Values.k8sRuntime.warmPool.size | int64 | quote }}
  K8S_WARM_POOL_TTL_MS: {{ .Values.k8sRuntime.warmPool.ttlMs | int64 | quote }}
  {{- end }}

  # Versions
  API_VERSION: {{ .Values.api.image.tag | quote }}
  WEB_VERSION: {{ .Values.web.image.tag | quote }}

  # Knowledge base
  KNOWLEDGE_REINDEX_ON_STARTUP: "true"

  # Daytona
  {{- if .Values.daytona.enabled }}
  DAYTONA_API_URL: {{ printf "http://%s-daytona-api:%v/api" (include "geniro.fullname" .) .Values.daytona.api.port | quote }}
  {{- else if .Values.externalDaytona.apiUrl }}
  DAYTONA_API_URL: {{ .Values.externalDaytona.apiUrl | quote }}
  {{- end }}
