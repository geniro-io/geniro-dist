{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geniro.fullname" . }}-postgres-init
  labels:
    {{- include "geniro.labels" . | nindent 4 }}
data:
  01-init-db.sh: |
    #!/bin/bash
    set -e
    export PGPASSWORD=$POSTGRES_PASSWORD
    DATABASES="geniro"
    {{- if .Values.litellm.enabled }}
    DATABASES="$DATABASES litellm"
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    DATABASES="$DATABASES keycloak"
    {{- end }}
    {{- if .Values.daytona.enabled }}
    DATABASES="$DATABASES daytona"
    {{- end }}
    {{- if .Values.zitadel.enabled }}
    DATABASES="$DATABASES zitadel"
    {{- end }}
    for db in $DATABASES; do
      echo "Creating database: $db"
      psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
        GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;
    EOSQL
    done
{{- end }}
