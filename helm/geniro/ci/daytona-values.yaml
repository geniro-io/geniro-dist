# WARNING: These credentials are for CI template validation only. Never use in a real cluster.
# CI test: validate template rendering with Daytona enabled
runtime:
  provider: daytona

secrets:
  openrouterApiKey: "sk-or-test"
  litellmMasterKey: "test-master"
  litellmSaltKey: "test-salt-key-for-ci-validation"

api:
  ingress:
    enabled: false

web:
  ingress:
    enabled: false

daytona:
  enabled: true
  api:
    env:
      DAYTONA_ADMIN_API_KEY: "ci-daytona-admin-key-for-testing"
      DAYTONA_RUNNER_API_KEY: "ci-daytona-runner-key-for-testing"
      DAYTONA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      DAYTONA_ENCRYPTION_SALT: "fedcba9876543210fedcba9876543210"

keycloak:
  enabled: true
  auth:
    adminPassword: "ci-keycloak-admin-password"
  realm:
    seedUser:
      password: "CiSeedPassword123!"

litellm:
  enabled: true

postgresql:
  enabled: true
  auth:
    postgresPassword: "test-ci-postgres-password"
    password: "test-ci-postgres-password"

redis:
  enabled: true

qdrant:
  enabled: true

zitadel:
  enabled: false
