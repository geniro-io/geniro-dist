# Minimal values for helm lint and helm template validation
secrets:
  credentialEncryptionKey: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  openrouterApiKey: "sk-or-test"
  litellmMasterKey: "test-master"
  litellmSaltKey: "test-salt-key-for-ci-validation"

api:
  ingress:
    enabled: true
    host: api.geniro.test

web:
  ingress:
    enabled: true
    host: geniro.test

litellm:
  enabled: true

daytona:
  enabled: true
  api:
    env:
      adminApiKey: "test-admin-key"
      runnerApiKey: "test-runner-key"
      encryptionKey: "0123456789abcdef0123456789abcdef"
      encryptionSalt: "fedcba9876543210fedcba9876543210"

keycloak:
  auth:
    adminPassword: "test-admin-password-ci"
  ingress:
    enabled: true
    host: auth.geniro.test

# Intentionally keeps keycloak.enabled at its default (true) to test
# the Keycloak + Zitadel both-enabled render path.
zitadel:
  enabled: true
  zitadel:
    masterkey: "MasterkeyNeedsToHave32Characters"
    configmapConfig:
      ExternalDomain: "zitadel.geniro.test"
      Database:
        Postgres:
          Host: "geniro-test-postgresql"
          User:
            Password: "geniro"
          Admin:
            Password: "geniro"

postgresql:
  enabled: true

redis:
  enabled: true

qdrant:
  enabled: true
