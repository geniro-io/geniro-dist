apiVersion: v2
name: geniro
description: >
  Umbrella Helm chart for the Geniro AI Agent Graph Platform.
  Deploys API, Web UI, LiteLLM proxy, Keycloak or Zitadel identity provider,
  and optional Daytona sandbox runtime.
type: application
version: 2.0.0
appVersion: "latest"
home: https://github.com/geniro-io/geniro
sources:
  - https://github.com/geniro-io/geniro
  - https://github.com/geniro-io/geniro-web
maintainers:
  - name: Geniro Team
    url: https://github.com/geniro-io
kubeVersion: ">=1.27.0-0"
annotations:
  keycloak/version: "26.1.4"
  litellm/default-tag: "main-stable"
  nginx/version: "1.27-alpine"

dependencies:
  - name: postgresql
    version: "18.5.1"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    alias: postgresql

  - name: redis
    version: "25.3.2"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
    alias: redis

  # Keycloak is deployed as in-chart templates (not a subchart) using the official
  # quay.io/keycloak/keycloak image. See templates/keycloak/ for the templates.

  - name: qdrant
    version: "1.17.0"
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled
    alias: qdrant

  - name: zitadel
    version: "9.24.0"
    repository: https://charts.zitadel.com
    condition: zitadel.enabled
    alias: zitadel
